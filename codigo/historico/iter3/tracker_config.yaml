# =====================================================================
# Configuracion del tracker ArUco - Multi-marker con dodecaedro
# =====================================================================

camera:
  source: 0
  width: 640
  height: 480
  fps: 30
  backend: MSMF
  fourcc: MJPG
  calibration_file: data/camera_calibration_caja_luz.yml


# =====================================================================
# Diccionario ArUco (uno solo para todos)
# =====================================================================
markers:
  dictionary: DICT_ARUCO_MIP_36h12

  # Marcadores INDIVIDUALES (que NO pertenecen a un rigid body)
  # Cada uno publica su propia transformada NameToTracker
  list:
    - id: 0
      name: Marker0
      size_mm: 60.8


# =====================================================================
# Rigid bodies multi-marker
# El sistema combina los marcadores visibles de un rigid body para
# estimar UNA sola pose conjunta optima.
# =====================================================================
rigid_bodies:
  - name: Dodecaedro
    geometry_file: data/reference_dodecaedro_calibrado.txt


# =====================================================================
# OpenIGTLink
# =====================================================================
igtlink:
  transforms_port: 18944
  video_port: 18945
  send_video: false


# =====================================================================
# Filtrado opcional
# 1-Euro filter sobre la POSICION (tvec) de markers individuales y
# rigid bodies. Reduce jitter sin lag perceptible en movimientos lentos.
# Parametros conservadores 2026-05-20:
#   min_cutoff=2.0: corte base 2 Hz (suaviza si esta quieto)
#   beta=0.05:      adaptativo (deja pasar mas alta freq cuando se mueve)
# Para movimientos quirurgicos lentos esto es transparente.
# =====================================================================
filtering:
  enabled: true
  min_cutoff: 2.0
  beta: 0.05


# =====================================================================
# Calidad de poses para rigid bodies
# Numero minimo de markers detectados para emitir una pose. Con menos
# de 3 markers la rotacion es inestable (jitter visible en el stylus).
# Si querias el comportamiento viejo (acepta cualquier N>=1), poner 1.
# =====================================================================
rigid_bodies_quality:
  min_markers: 3


# =====================================================================
# Debug
# =====================================================================
debug:
  show_window: true
  verbose: true
